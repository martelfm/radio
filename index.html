<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martel FM</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(17, 24, 39, 0.96);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #22c55e;
      --accent-2: #16a34a;
      --border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .player {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      text-align: center;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 24px;
      margin: 0 auto 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      display: block;
    }

    .fallback-title {
      display: none;
      margin: 0 0 14px;
      font-size: 34px;
      line-height: 1.1;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .now-playing-box {
      margin: 14px 0 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      text-align: left;
    }

    .np-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .artist {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 3px;
      line-height: 1.25;
    }

    .title {
      font-size: 15px;
      color: #e2e8f0;
      line-height: 1.35;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 14px 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      transition: 0.2s ease;
    }

    .dot.playing {
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.18);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .primary {
      background: var(--accent);
      color: white;
      font-weight: 700;
      min-width: 160px;
    }

    .primary:hover {
      background: var(--accent-2);
    }

    audio {
      width: 100%;
      margin-top: 18px;
      border-radius: 12px;
    }

    .error {
      margin-top: 14px;
      color: #fecaca;
      font-size: 14px;
      display: none;
      text-align: left;
    }

    @media (max-width: 600px) {
      .player { padding: 22px; }
      .logo { width: 140px; height: 140px; }
      .fallback-title { font-size: 28px; }
      .artist { font-size: 18px; }
      .title { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="player">
    <img id="logo" src="/radio/logo.jpg" alt="Logo Martel FM" class="logo" />
    <h1 id="fallbackTitle" class="fallback-title">Martel FM</h1>

    <div class="badge">Radio en direct</div>

    <section class="now-playing-box">
      <div class="np-label">En ce moment</div>
      <div id="artist" class="artist">Chargement…</div>
      <div id="title" class="title">Récupération des informations du flux</div>
    </section>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">En attente de lecture</span>
    </div>

    <button id="playBtn" class="primary">Écouter</button>

    <audio id="radio" controls preload="none">
      <source src="https://martelfm.synology.me/stream" type="audio/mpeg" />
      Votre navigateur ne prend pas en charge la lecture audio.
    </audio>

    <div id="errorBox" class="error"></div>
  </main>

  <script>
    const audio = document.getElementById('radio');
    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const errorBox = document.getElementById('errorBox');
    const artistEl = document.getElementById('artist');
    const titleEl = document.getElementById('title');
    const logoEl = document.getElementById('logo');
    const fallbackTitle = document.getElementById('fallbackTitle');

    function setTitleVisibility(visible) {
      fallbackTitle.style.display = visible ? 'block' : 'none';
    }

    logoEl.addEventListener('load', () => setTitleVisibility(false));
    logoEl.onerror = function () {
      if (logoEl.getAttribute('src') !== './logo.jpg') {
        logoEl.setAttribute('src', './logo.jpg');
      } else {
        logoEl.style.display = 'none';
        setTitleVisibility(true);
      }
    };

    function setPlayingState(isPlaying) {
      if (isPlaying) {
        statusText.textContent = 'Lecture en cours';
        statusDot.classList.add('playing');
        playBtn.textContent = 'Pause';
      } else {
        statusText.textContent = 'En attente de lecture';
        statusDot.classList.remove('playing');
        playBtn.textContent = 'Écouter';
      }
    }

    function showError(message) {
      errorBox.style.display = 'block';
      errorBox.textContent = message;
    }

    function clearError() {
      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }

    function parseTitle(rawTitle) {
      if (!rawTitle || typeof rawTitle !== 'string') {
        return { artist: 'Informations indisponibles', title: 'Aucun titre détecté' };
      }

      const separators = [' - ', ' – ', ' — '];
      for (const sep of separators) {
        if (rawTitle.includes(sep)) {
          const parts = rawTitle.split(sep);
          if (parts.length >= 2) {
            return {
              artist: parts[0].trim() || 'Artiste inconnu',
              title: parts.slice(1).join(sep).trim() || 'Titre inconnu'
            };
          }
        }
      }

      return { artist: 'En diffusion', title: rawTitle.trim() };
    }

    function extractCurrentSource(data) {
      if (!data || !data.icestats || !data.icestats.source) return null;
      const source = data.icestats.source;
      return Array.isArray(source) ? (source[0] || null) : source;
    }

    async function fetchNowPlaying() {
      try {
        const res = await fetch('https://martelfm.synology.me/status-json.xsl', { cache: 'no-store' });
        if (!res.ok) throw new Error('Réponse HTTP invalide');

        const data = await res.json();
        const current = extractCurrentSource(data);

        if (!current) {
          artistEl.textContent = 'Flux détecté';
          titleEl.textContent = 'Aucune métadonnée disponible';
          return;
        }

        const rawTitle = current.title || current.server_name || current.listenurl || '';
        const parsed = parseTitle(rawTitle);
        artistEl.textContent = parsed.artist;
        titleEl.textContent = parsed.title;
      } catch (err) {
        artistEl.textContent = 'Métadonnées indisponibles';
        titleEl.textContent = 'Le flux fonctionne, mais les informations de piste ne sont pas accessibles.';
      }
    }

    playBtn.addEventListener('click', async () => {
      clearError();
      if (audio.paused) {
        try {
          await audio.play();
        } catch (err) {
          showError("La lecture a été bloquée ou le flux n'a pas pu démarrer.");
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('playing', () => {
      clearError();
      setPlayingState(true);
    });

    audio.addEventListener('pause', () => {
      setPlayingState(false);
    });

    audio.addEventListener('waiting', () => {
      statusText.textContent = 'Connexion au flux...';
    });

    audio.addEventListener('error', () => {
      showError("Erreur de lecture du flux. Vérifie que l'URL HTTPS du stream répond toujours.");
      statusText.textContent = 'Erreur de lecture';
      statusDot.classList.remove('playing');
      playBtn.textContent = 'Écouter';
    });

    fetchNowPlaying();
    setInterval(fetchNowPlaying, 15000);
  </script>
</body>
</html>
