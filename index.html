<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martel FM</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1a1f27;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
      text-align: center;
    }

    .logo {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      margin: 0 auto 18px;
      background: #111;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #aeb6c2;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .now-label {
      font-size: 12px;
      color: #8f98a6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .track {
      min-height: 48px;
      font-size: 18px;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    audio {
      width: 100%;
      margin-top: 8px;
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #8f98a6;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="Logo Martel FM" class="logo">
    <h1>Martel FM</h1>
    <div class="subtitle">Radio en ligne</div>

    <div class="now-label">Titre en cours</div>
    <div class="track" id="track">Chargement...</div>

    <audio controls preload="none">
      <source src="http://martelfm.synology.me:52732/stream" type="audio/mpeg">
      Votre navigateur ne supporte pas l’audio HTML5.
    </audio>

    <div class="note" id="note"></div>
  </div>

  <script>
    const statusUrl = "http://martelfm.synology.me:52732/status-json.xsl";
    const mountName = "/stream";
    const trackEl = document.getElementById("track");
    const noteEl = document.getElementById("note");

    async function updateTrack() {
      try {
        const response = await fetch(statusUrl, { cache: "no-store" });
        const data = await response.json();
        let source = data.icestats && data.icestats.source;

        if (Array.isArray(source)) {
          source = source.find(s =>
            (s.listenurl && s.listenurl.includes(mountName)) ||
            (s.server_name && s.server_name.includes("Martel"))
          ) || source[0];
        }

        let title = source && source.title ? source.title : "";
        if (title === "-" || title.trim() === "") {
          title = "Aucun titre disponible";
        }

        trackEl.textContent = title;
        noteEl.textContent = "Mise à jour automatique toutes les 10 secondes";
      } catch (error) {
        trackEl.textContent = "Titre indisponible";
        noteEl.textContent = "Le flux peut fonctionner même si les métadonnées ne sont pas accessibles.";
      }
    }

    updateTrack();
    setInterval(updateTrack, 10000);
  </script>
</body>
</html>
